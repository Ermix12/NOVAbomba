name: Build Mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Fabric Mod
        run: |
          if [ -d "fabric" ]; then
            cd fabric
            chmod +x gradlew || true
            if [ -f "./gradlew" ]; then
              ./gradlew build
            else
              gradle build
            fi
          else
            chmod +x gradlew || true
            ./gradlew build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: |
            **/build/libs/*.jar
